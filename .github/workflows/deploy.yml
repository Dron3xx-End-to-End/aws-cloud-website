on:
  push:
    paths:
      - "*.html"
      - "css/**"
      - "js/**"

env:
  AWS_REGION: eu-central-1
  AWS_S3_BUCKET: dawid-portfolio
  CLOUDFRONT_DISTRIBUTION_ID: E1X6GU32YTVBQ3

jobs:
  Validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      #HTML/CSS validation
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: "."
          extra: "--skip-non-html"

      - name: Validate links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --verbose --no-progress "./**/*.html" --timeout 5

      - name: Validate CSS
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: "css/"
          css: true

      - name: Validate JS
        uses: biomejs/setup-biome@v2.7.1
      - run: |
          biome check ./js


      #Python validation
      - name: Install python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: |
          ruff check . --select ALL --ignore D203,D212,INP001,CPY001

      - name: Check Ruff Formatting
        run: 
          ruff format --check .

  Update_Last_updated:
    runs-on: ubuntu-latest
    needs: Validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Update Script
        run: |
          python scripts/update_last_update.py

      - name: Create Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: website-html-css-js
          path: |
            index.html
            css/
            js/
          if-no-files-found: error

  Deploy:
    runs-on: ubuntu-latest
    needs: Update_Last_updated
    permissions:
      id-token: write
      contents: read

    steps:      
      - name: Download Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: website-html-css-js
          path: website

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync files to S3
        run: |
          aws s3 sync website/ s3://${{ env.AWS_S3_BUCKET }} --delete

      - name: Verify S3 files
        run: |
          aws s3 cp s3://${{ env.AWS_S3_BUCKET }}/css/styles.css -

      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Wait for invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"
